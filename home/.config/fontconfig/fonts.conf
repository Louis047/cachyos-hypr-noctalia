<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- User-level family mapping only. Rendering (antialias/hinting/rgba/lcdfilter/bitmap) is system-level in /etc/fonts/conf.d/. -->

  <!-- Unconditional fallbacks for queries without size (most UI defaults to Text optical) -->
  <alias>
    <family>sans</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <!-- Serif default (strong: beats system 60-latin loaded after 50-user) -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- Sans: macOS exact — Text <=19pt, Display >=20pt -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- OS-default sans slots: Noto Sans, Liberation Sans (installed site-stack blockers) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <!-- pixelsize variants: 19pt~=25.3px, 20pt~=26.7px at CSS 96dpi -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans</string></test>
    <test name="pixelsize" compare="less_eq"><double>25</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans</string></test>
    <test name="pixelsize" compare="more_eq"><double>26</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <!-- pixelsize variants: 19pt~=25.3px, 20pt~=26.7px at CSS 96dpi -->
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <test name="pixelsize" compare="less_eq"><double>25</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Text</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <test name="pixelsize" compare="more_eq"><double>26</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Serif: macOS New York — Small <=19pt, ExtraLarge >=20pt (OTF) -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Extra Large</string>
      <string>New York Large</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-serif</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Extra Large</string>
      <string>New York Large</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- OS-default serif slot: Liberation Serif (also catches Times New Roman via metric chain) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Serif</string></test>
    <test name="size" compare="less_eq"><double>19</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Extra Large</string>
      <string>New York Large</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <!-- pixelsize variants: 19pt~=25.3px, 20pt~=26.7px at CSS 96dpi -->
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Serif</string></test>
    <test name="pixelsize" compare="less_eq"><double>25</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Small</string>
      <string>New York Medium</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Serif</string></test>
    <test name="pixelsize" compare="more_eq"><double>26</double></test>
    <edit name="family" mode="assign" binding="same">
      <string>New York Extra Large</string>
      <string>New York Large</string>
      <string>New York</string>
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
    </edit>
  </match>
  <!-- Unconditional slot safety nets (run last: sized rules above take precedence when size/pixelsize present) -->
  <alias binding="same">
    <family>Noto Sans</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Liberation Sans</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Liberation Serif</family>
    <prefer>
      <family>New York Small</family>
      <family>New York Medium</family>
      <family>New York</family>
      <family>Source Serif 4</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Monospace: JetBrainsMono Nerd Font Mono (OTF-family logic N/A, TTF kept) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>mono</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <!-- ui-monospace strong: fixes mono->sans mis-resolution to SF Pro Text -->
  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>
  <!-- Explicit mono slots (devtools-verified self-hits in Helium): strong, tail preserves coverage -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>

  <!-- Emoji: Apple Color Emoji default -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="append"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append"><string>Apple Color Emoji</string></edit>
  </match>

  <!-- Competitor emoji remaps (mirrors 75-apple-color-emoji.conf, kept inline for robustness) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>NotoColorEmoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Android Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Twitter Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Symbola</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains">
      <string>DejaVu</string>
    </test>
    <edit name="charset" mode="assign" binding="same">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0x1f600</int>
            <int>0x1f640</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
