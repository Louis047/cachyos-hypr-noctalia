include themes/noctalia.conf
background_opacity 0.97
background_blur 1

font_family JetBrainsMono Nerd Font Mono
font_size 10.25

cursor_shape beam
cursor_beam_thickness 5
cursor_stop_blinking_after 15.0
cursor_trail 1
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 0
cursor_blink_interval 0.5 ease-in-out
repaint_delay 6

window_padding_width 12 14

scrollback_lines 5000
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

# Smooth scrolling (kitty scrollback only, not fullscreen TUIs)
# pixel_scroll needs high-precision input (touchpad/touchscreen, Wayland native momentum)
pixel_scroll yes
momentum_scroll 0.96

# Scrollbar drag also pixel-scrolls; make it easy to grab
scrollbar scrolled-or-hovered
scrollbar_interactive yes

# Animated keyboard scrolling (defaults, made explicit)
map ctrl+shift+up scroll_line_up smooth
map ctrl+shift+down scroll_line_down smooth

mouse_hide_wait -1
