config_version = 16

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule_thickness = 0.99999998137354851
    center = [ "active_window" ]
    color = "on_surface"
    end = [ "group:g2", "group:g3", "group:g1", "group:g4" ]
    font_family = "SF Pro Text"
    hover_highlight = false
    icon_color = "on_surface"
    margin_edge = 4
    margin_ends = 0
    panel_overlap = 3
    start = [ "control-center", "workspaces" ]

        [bar.default.dead_zone.actions]
        right = "none"

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "Tools", "bar", "notes", "clipboard", "notifications", "status", "github", "current", "session" ]
        opacity = 0.0
        padding = 0.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "volume", "network", "battery" ]
        opacity = 0.0
        padding = 0.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g3"
        members = [ "Info", "sysmon", "cpu", "ram", "temp" ]
        opacity = 0.0
        padding = 0.0
        radius = 0.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "tray", "clock" ]
        opacity = 0.0
        padding = 0.0

[control_center]
show_session_button = false
show_shortcut_labels = false
sidebar_section = "none"
width = 820

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 1.0
inactive_opacity = 1.0

[hooks]
battery_charging = "~/.config/hypr/scripts/power-refresh.sh"
battery_discharging = "~/.config/hypr/scripts/power-refresh.sh"
battery_plugged = "~/.config/hypr/scripts/power-refresh.sh"
started = "~/.config/hypr/scripts/power-refresh.sh"

[location]
auto_locate = true

[lockscreen]
edge_smoothness = 0.74999998323619366
transition = [ "wipe" ]
transition_duration = 500

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 956.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 256.0
    cx = 960.0
    cy = 943.75
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 0.90000000000000002
        input_radius = 16.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 160.0
    box_width = 320.0
    cx = 970.0
    cy = 200.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        center_text = true
        circle = true
        clock_style = "digital"
        color = "on_surface"
        font_family = ""
        format = "{:%H:%M}"
        shadow = true
        timezone = ""

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 32.0
    box_width = 288.0
    cx = 970.0
    cy = 300.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        clock_style = "digital"
        format = "{:%A, %d %B %Y}"

[plugin_settings."noctalia/notes"]
panel_open_near_click = true
panel_position = "auto"

[plugin_settings."shangshui0302/github-kanban"]
appearance_density = "comfortable"
following_hide_bots = true
kanban_placement = "floating"

[plugin_settings."yuuto/calculator"]
panel_placement = "floating"

[plugins]
enabled = [ "noctalia/notes", "shangshui0302/github-kanban", "thaer99ob/default-apps", "yuuto/calculator", "aristides/udiskie" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "~/Pictures/Profile/luffy_face_transparent.png"
corner_radius_scale = 0.66666669999999995
font_family = "SF Pro Display"
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true
settings_expand_all_groups = true
settings_window_translucent = true
show_location = false
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    show_app_actions = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.screenshot]
    annotate = true

    [shell.session]
    grid = true
    grid_columns = 1

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "suspend"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        variant = "destructive"

    [shell.shadow]
    alpha = 0.99999997764825821
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "Vesper"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "antigravity",
        "opencode",
        "zapfast",
        "gimp",
        "libreoffice",
        "micro",
        "heroiclauncher",
        "obs",
        "zathura",
        "hyprtoolkit",
        "papirus-icons"
    ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/Fractal-Glass/wc-fractal-glass-v1-purple-[5120x2880].png"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/Fractal-Glass/wc-fractal-glass-v1-purple-[5120x2880].png"

    [wallpaper.monitors.HDMI-A-1]
    path = "~/Pictures/Wallpapers/Normal Wallpapers/gzml-shell.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/Wallpapers/Fractal-Glass/wc-fractal-glass-v1-purple-[5120x2880].png"

[widget.Info]
glyph = "heart-rate-monitor"
type = "custom_button"

[widget.Tools]
glyph = "menu-2"
type = "custom_button"

[widget.active_window]
anchor = true
capsule_opacity = 0.0
icon_size = 18
interactive = false
max_length = 512
title_scroll = "always"

[widget.bar]
type = "yuuto/calculator:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
capsule_fill = "outline_variant"
capsule_padding = 10

[widget.cpu]
visualization = "none"

[widget.current]
type = "thaer99ob/default-apps:current"

[widget.github]
type = "shangshui0302/github-kanban:github"

[widget.launcher]
custom_image_colorize = true
glyph = "assembly-filled"

[widget.media]
album_art_only = true
art_size = 12
hide_artist = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.session]
capsule_fill = "outline_variant"

[widget.status]
type = "aristides/udiskie:status"

[widget.sysmon]
show_value = true
stat = "disk_used_pct"
visualization = "none"

[widget.temp]
visualization = "none"

[widget.tray]
detached_panel = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false
show_temperature = false

[widget.workspaces]
active_pill_size = 2.0
change_color_on_hover = false
empty_color = "on_surface_variant"
focused_color = "on_surface"
occupied_color = "on_surface_variant"
pill_scale = 0.65000000000000002
show_all_outputs = true
show_labels = false